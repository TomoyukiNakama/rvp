[package]
name = "rvp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "persistence"] }
egui = "0.36"
egui-phosphor = "0.14.0"
egui-wgpu = "0.36"
encoding_rs = "0.8.44"
env_logger = "0.11.11"
ffmpeg-next = "9"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.35"
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

# Keep debug builds fast enough for real-time video.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
